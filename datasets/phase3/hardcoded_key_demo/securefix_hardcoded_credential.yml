rules:
  - id: securefix.python.hardcoded-credential.api-key-literal
    languages:
      - python
    severity: WARNING
    message: API key is assigned from a source-code string literal.
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      vulnerability_class:
        - Hardcoded Credential
    patterns:
      - pattern: $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: "(?i).*(api[_-]?key|secret|token).*"
